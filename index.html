<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rizwan & Adellia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- BACKGROUND ORBS -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- KONTEN UTAMA -->
    <div class="container">
        <div class="card">
            <div class="avatar">
                <img src="images/fotopacar.jpeg" alt="Kita">
            </div>
            
            <h1 class="name">Rizwan & Adellia</h1>
            <p class="sub-text">
                Our memories together 💕
            </p>
            
            <button class="btn" onclick="bukaGaleri()">
                <span>📸</span> Lihat Kenangan
            </button>
        </div>
    </div>

    <!-- MODAL GALERI -->
    <div class="modal" id="modalGaleri">
        <button class="close-btn" onclick="tutupGaleri()">✕</button>
        
        <div class="modal-content">
            <h2>Kenangan Kita</h2>
            <div class="gallery-grid" id="galleryGrid">
                <!-- Foto muncul di sini -->
            </div>
            
            <button class="btn btn-secondary" onclick="lihatPacar()">
                ❤️ See Our Love
            </button>
        </div>
    </div>

    <!-- MODAL PESAN (KATA-KATA) -->
    <div class="modal" id="modalPesan">
        <button class="close-btn" onclick="tutupPesan()">✕</button>
        
        <div class="modal-pesen-content">
            <div class="quote-icon">✦</div>
            <p class="quote-text" id="quoteText"></p>
            <p class="quote-author" id="quoteAuthor"></p>
            <button class="btn" onclick="tutupPesan()">Tutup</button>
        </div>
    </div>

    <!-- FOOTER (FOTO PACAR) -->
    <div class="special-footer" id="sectionPacar">
        <button class="close-btn" onclick="kembaliKeUtama()">✕</button>
        
        <div class="footer-content">
            <p class="footer-label">❤️ My Everything</p>
            
            <div class="photo-frame">
                <img src="images/fotopacar.jpeg" alt="Kita" class="couple-photo">
            </div>
            
            <h2 class="couple-name">Rizwan Alessio Widiansyach</h2>
            <p class="heart">❤️</p>
            <h2 class="couple-name">Adellia Putri Fernanda</h2>
            
            <p class="footer-subtext">Forever & Always 💕</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
