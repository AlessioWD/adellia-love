<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantikku Adellia</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --pink: #ff6b9d;
        --pink-light: #ff8fab;
        --pink-pale: #ffb6c1;
        --white: #ffffff;
        --glass: rgba(255,255,255,0.22);
        --glass-border: rgba(255,255,255,0.45);
        --radius-card: 28px;
        --radius-btn: 50px;
        --shadow: 0 8px 32px rgba(255,107,157,0.25);
    }

    html { font-size: 16px; }

    body {
        font-family: 'Nunito', sans-serif;
        background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffb6c1 100%);
        color: var(--white);
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* ── BACKGROUND HEARTS ── */
    .bg-hearts {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 0;
        overflow: hidden;
    }
    .bg-heart {
        position: absolute;
        font-size: clamp(0.9rem, 2vw, 1.3rem);
        opacity: 0.13;
        animation: floatHeart 5s ease-in-out infinite;
    }
    @keyframes floatHeart {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.13; }
        50% { transform: translateY(-18px) rotate(10deg); opacity: 0.26; }
    }

    /* ── LAYOUT WRAPPER ── */
    .page-wrapper {
        position: relative; z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: clamp(16px, 4vw, 40px);
    }

    /* ── MAIN CARD ── */
    .card {
        background: var(--glass);
        border: 2px solid var(--glass-border);
        border-radius: var(--radius-card);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: clamp(28px, 5vw, 48px) clamp(24px, 5vw, 48px);
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-shadow: var(--shadow);
    }

    .avatar {
        width: clamp(100px, 28vw, 140px);
        height: clamp(100px, 28vw, 140px);
        border-radius: 50%;
        border: 4px solid var(--white);
        object-fit: cover;
        box-shadow: 0 0 30px rgba(255,107,157,0.6);
        margin-bottom: 16px;
    }

    .card h1 {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.5rem, 5vw, 2rem);
        margin-bottom: 8px;
        letter-spacing: 0.01em;
    }

    .card p {
        opacity: 0.88;
        font-size: clamp(0.85rem, 2.5vw, 1rem);
        margin-bottom: 20px;
    }

    /* ── BUTTONS ── */
    .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: linear-gradient(135deg, var(--pink), var(--pink-light));
        color: var(--white);
        border: none;
        padding: clamp(11px, 2vw, 14px) clamp(28px, 6vw, 40px);
        font-size: clamp(14px, 2.5vw, 16px);
        border-radius: var(--radius-btn);
        cursor: pointer;
        font-weight: 700;
        font-family: 'Nunito', sans-serif;
        margin-top: 8px;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 18px rgba(255,107,157,0.4);
        white-space: nowrap;
    }
    .btn:hover { transform: scale(1.05); box-shadow: 0 6px 24px rgba(255,107,157,0.6); }
    .btn:active { transform: scale(0.98); }

    .btn-outline {
        background: transparent;
        border: 2px solid var(--pink);
        color: var(--pink);
        box-shadow: none;
    }
    .btn-outline:hover { background: var(--pink); color: var(--white); }

    /* ── MODAL BASE ── */
    .modal {
        display: none;
        position: fixed; inset: 0;
        background: linear-gradient(135deg, rgba(255,107,157,0.97), rgba(219,112,147,0.97));
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: clamp(12px, 4vw, 30px);
        overflow-y: auto;
    }

    .modal-inner {
        background: var(--white);
        border-radius: var(--radius-card);
        padding: clamp(22px, 4vw, 36px) clamp(18px, 4vw, 32px);
        width: 100%;
        max-width: 400px;
        color: #333;
        margin: auto;
        position: relative;
        box-shadow: 0 12px 48px rgba(255,107,157,0.35);
    }

    .modal-inner h2 {
        font-family: 'Playfair Display', serif;
        color: var(--pink);
        margin-bottom: 14px;
        font-size: clamp(1.25rem, 4vw, 1.6rem);
    }

    .modal-inner > p,
    .modal-inner .soal-text {
        color: #444;
        font-size: clamp(0.9rem, 2.5vw, 1rem);
        font-weight: 600;
        line-height: 1.5;
        margin-bottom: 16px;
    }

    .option-btn {
        display: block;
        width: 100%;
        padding: clamp(10px, 2vw, 13px) clamp(14px, 3vw, 18px);
        margin: 8px 0;
        background: #fff0f4;
        color: var(--pink);
        border: 2px solid #ffb6c1;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        font-size: clamp(0.85rem, 2.2vw, 0.95rem);
        font-family: 'Nunito', sans-serif;
        transition: all 0.2s;
        text-align: left;
    }
    .option-btn:hover { background: var(--pink); color: var(--white); border-color: var(--pink); }

    .progress-text {
        font-size: 11px;
        color: #ffaac2;
        margin-top: 14px;
        text-align: right;
    }

    /* ── CLOSE BUTTON ── */
    .close-btn {
        position: absolute;
        top: clamp(10px, 2vw, 14px);
        right: clamp(10px, 2vw, 14px);
        width: 36px; height: 36px;
        border-radius: 50%;
        background: var(--white);
        color: var(--pink);
        border: 2px solid #ffb6c1;
        font-size: 16px;
        cursor: pointer;
        z-index: 1001;
        font-weight: bold;
        font-family: 'Nunito', sans-serif;
        transition: transform 0.2s, background 0.2s;
        display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { transform: scale(1.1); background: #ffebef; }

    /* ── GALLERY MODAL ── */
    #modalGaleri .modal-inner { max-width: 480px; }

    .gallery {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(8px, 2vw, 14px);
        margin-bottom: 18px;
    }

    .gallery-item {
        position: relative;
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        aspect-ratio: 1;
        transition: transform 0.2s, box-shadow 0.2s;
        border: 2px solid #ffccd5;
    }
    .gallery-item:hover { transform: scale(1.03); box-shadow: 0 8px 24px rgba(255,107,157,0.45); }

    .gallery-item img {
        width: 100%; height: 100%;
        object-fit: cover; display: block;
    }

    .nomor {
        position: absolute; top: 6px; left: 6px;
        background: linear-gradient(135deg, var(--pink), var(--pink-light));
        color: var(--white);
        font-size: 10px;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 12px;
        z-index: 1;
        font-family: 'Nunito', sans-serif;
    }

    /* ── FOOTER / LOVE PAGE ── */
    #footer {
        background: linear-gradient(145deg, #ff9a9e, #fecfef, #ffb6c1);
    }

    .balloon-container {
        position: fixed; inset: 0;
        pointer-events: none; z-index: 0;
        overflow: hidden;
    }
    .balloon {
        position: absolute;
        bottom: -60px;
        font-size: clamp(1.2rem, 3vw, 1.6rem);
        animation: balloonRise 8s linear infinite;
        opacity: 0;
    }
    @keyframes balloonRise {
        0% { transform: translateY(0) rotate(0deg); opacity: 0; }
        10% { opacity: 0.75; }
        90% { opacity: 0.75; }
        100% { transform: translateY(-110vh) rotate(15deg); opacity: 0; }
    }

    .footer-content {
        position: relative; z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 420px;
        padding: clamp(20px, 4vw, 36px) clamp(16px, 4vw, 32px);
        background: rgba(255,255,255,0.18);
        border: 2px solid rgba(255,255,255,0.45);
        border-radius: var(--radius-card);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        text-align: center;
        box-shadow: var(--shadow);
        margin: auto;
    }

    .video-frame {
        width: 100%;
        max-width: clamp(200px, 60vw, 300px);
        border-radius: 18px;
        border: 4px solid rgba(255,255,255,0.75);
        overflow: hidden;
        box-shadow: 0 0 30px rgba(255,107,157,0.5);
    }
    .video-frame video {
        width: 100%; height: auto;
        display: block; border-radius: 14px;
    }

    .footer-content > p {
        opacity: 0.9;
        font-size: clamp(0.85rem, 2.2vw, 0.95rem);
    }

    .couple-name {
        font-family: 'Playfair Display', serif;
        font-size: clamp(1.1rem, 4vw, 1.4rem);
        font-weight: 700;
        color: var(--white);
        line-height: 1.3;
    }

    .heart-anim {
        font-size: clamp(1.6rem, 5vw, 2.2rem);
        animation: heartBeat 1s ease-in-out infinite;
        display: block;
    }
    @keyframes heartBeat {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.18); }
    }

    /* ── LIGHTBOX ── */
    .lightbox {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.92);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .lightbox img {
        max-width: 100%;
        max-height: 80vh;
        border-radius: 14px;
        object-fit: contain;
    }
    .lightbox-close {
        position: absolute; top: 16px; right: 16px;
        width: 40px; height: 40px;
        border-radius: 50%;
        background: var(--white);
        color: var(--pink);
        border: none;
        font-size: 20px; cursor: pointer;
        font-weight: bold;
        display: flex; align-items: center; justify-content: center;
    }

    /* ── DESKTOP ENHANCEMENTS (≥640px) ── */
    @media (min-width: 640px) {
        .card { max-width: 460px; }
        .modal-inner { max-width: 440px; }
        #modalGaleri .modal-inner { max-width: 520px; }
        .gallery { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        .footer-content { max-width: 460px; }
    }

    /* ── LARGE DESKTOP (≥1024px) ── */
    @media (min-width: 1024px) {
        .card { max-width: 500px; }
        #modalGaleri .modal-inner { max-width: 560px; }
        .gallery { grid-template-columns: repeat(2, 1fr); gap: 16px; }
    }

    /* ── VERY SMALL PHONES (≤360px) ── */
    @media (max-width: 360px) {
        .option-btn { padding: 9px 12px; }
        .btn { padding: 10px 22px; }
    }
    </style>
</head>
<body>

    <!-- Background hearts -->
    <div class="bg-hearts">
        <div class="bg-heart" style="top:4%;left:4%">💗</div>
        <div class="bg-heart" style="top:14%;right:8%;animation-delay:0.8s">💕</div>
        <div class="bg-heart" style="top:28%;left:6%;animation-delay:1.5s">❤️</div>
        <div class="bg-heart" style="top:44%;right:4%;animation-delay:2.2s">💖</div>
        <div class="bg-heart" style="top:60%;left:10%;animation-delay:0.4s">💘</div>
        <div class="bg-heart" style="top:74%;right:9%;animation-delay:1.8s">💝</div>
        <div class="bg-heart" style="top:87%;left:4%;animation-delay:3s">💗</div>
        <div class="bg-heart" style="top:22%;left:22%;animation-delay:2.5s">💕</div>
        <div class="bg-heart" style="top:54%;right:22%;animation-delay:1.2s">💖</div>
        <div class="bg-heart" style="top:80%;right:18%;animation-delay:0.6s">❤️</div>
    </div>

    <!-- ── Halaman Utama ── -->
    <div class="page-wrapper">
        <div class="card">
            <img src="images/fotopacar.jpeg" class="avatar" alt="Foto Kita">
            <h1>Hai Cantik Adellia 💗</h1>
            <p>Our memories together</p>
            <button class="btn" id="btnMulai">Mulai Quiz 💌</button>
        </div>
    </div>

    <!-- ── Modal Quiz ── -->
    <div id="modalQuiz" class="modal">
        <div class="modal-inner">
            <h2>Question <span id="noSoal">1</span></h2>
            <p class="soal-text" id="soal"></p>
            <div id="pilihan"></div>
            <p class="progress-text">Pertanyaan <span id="progress">1/5</span></p>
        </div>
    </div>

    <!-- ── Modal Salah ── -->
    <div id="modalSalah" class="modal">
        <div class="modal-inner" style="text-align:center;">
            <h2 id="txtSalah">Salah!</h2>
            <p id="msgSalah" style="margin-bottom:20px;">Coba lagi ya...</p>
            <button class="btn" id="btnCobaLagi">Coba Lagi 🔁</button>
        </div>
    </div>

    <!-- ── Modal Pesan / Kata-kata Foto ── -->
    <div id="modalPesan" class="modal">
        <div class="modal-inner" style="text-align:center;">
            <h2 id="txtPesan">Kata-kata</h2>
            <p id="msgPesan" style="margin-bottom:20px;"></p>
            <button class="btn" id="btnLihatLain">Lihat Foto Lain 📷</button>
        </div>
    </div>

    <!-- ── Modal Galeri ── -->
    <div id="modalGaleri" class="modal">
        <div class="modal-inner" style="text-align:center;">
            <button class="close-btn" id="btnCloseGaleri">✕</button>
            <h2>Semua Kenangan Kita 💞</h2>
            <div class="gallery" id="gallery"></div>
            <button class="btn btn-outline" id="btnSeeFooter">See Our Love ❤️</button>
        </div>
    </div>

    <!-- ── Footer / Love Page ── -->
    <div id="footer" class="modal">
        <div class="balloon-container">
            <div class="balloon" style="left:6%;animation-delay:0s">💗</div>
            <div class="balloon" style="left:22%;animation-delay:1s">💕</div>
            <div class="balloon" style="left:40%;animation-delay:2s">❤️</div>
            <div class="balloon" style="left:57%;animation-delay:0.5s">💖</div>
            <div class="balloon" style="left:73%;animation-delay:1.5s">💘</div>
            <div class="balloon" style="left:88%;animation-delay:2.5s">💝</div>
            <div class="balloon" style="left:14%;animation-delay:3s">💗</div>
            <div class="balloon" style="left:49%;animation-delay:3.5s">💕</div>
            <div class="balloon" style="left:31%;animation-delay:4s">❤️</div>
            <div class="balloon" style="left:66%;animation-delay:4.5s">💖</div>
        </div>
        <div class="footer-content">
            <button class="close-btn" id="btnCloseFooter" style="position:absolute;top:12px;right:12px;">✕</button>
            <div class="video-frame">
                <video id="videoKita" autoplay muted playsinline loop controls>
                    <source src="images/video_kita.mp4" type="video/mp4">
                    Browser kamu tidak mendukung video.
                </video>
            </div>
            <p>My Everything</p>
            <h2 class="couple-name">Rizwan Alessio Widiansyach</h2>
            <span class="heart-anim">❤️</span>
            <h2 class="couple-name">Adellia Putri Fernanda</h2>
            <p>Forever & Always 💕</p>
            <button class="btn" id="btnLihatFoto">Lihat Foto Kita 📸</button>
        </div>
    </div>

    <!-- ── Lightbox ── -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close" id="btnCloseLightbox">✕</button>
        <img id="lightboxImg" src="" alt="Foto">
    </div>

<script>
    var foto = [
        'images/foto1.jpeg',
        'images/foto2.jpeg',
        'images/foto3.jpeg',
        'images/foto4.jpeg'
    ];

    var soal = [
        {q: "Apa yang kamu rasakan saat pertama kali kita bertemu?", a: "Happy & Deg-degan", salah: ["Gak Happy", "Biasa aja"]},
        {q: "Tanggal jadian kita?", a: "20 Juni 2024", salah: ["1 Januari 2024", "15 Agustus 2024"]},
        {q: "Makanan yang aku GAK SUKA?", a: "Kentang", salah: ["Nasi Padang", "Mie Ayam"]},
        {q: "Dimana kita pertama kali bertemu?", a: "TW Cafe & Eatery", salah: ["Mall", "Kampus"]},
        {q: "Di mana aku menembak kamu?", a: "Di jalan mau antar ke kampus", salah: ["Di chat WA", "Di mall"]}
    ];

    var kalimatSalah = [
        {judul: "Ihh Ayang 😅", pesan: "Salah nih, coba lagi dong~"},
        {judul: "Jangan Bohong 😄", pesan: "Boongan ya? Coba pikir lagi!"},
        {judul: "Salah Lagi 😂", pesan: "Wkwk salah lagi nih, masa gak inget?"},
        {judul: "Ayang~ 🥺", pesan: "Salah mulu, masa gak inget sih?"},
        {judul: "Hmmm... 🤔", pesan: "Salah terus, coba ingat-ingat lagi ya!"}
    ];

    var kataFoto = [
        {judul: "Kenangan #1 💗", pesan: "Kenangan pertama kita yang paling spesial. Aku selalu ingat momen ini."},
        {judul: "Kenangan #2 💕", pesan: "Setiap momen bersamamu seperti keajaiban. Terima kasih sudah ada."},
        {judul: "Kenangan #3 ❤️", pesan: "Waktu cepat berlalu, tapi kenangan ini terukir selamanya di hatiku."},
        {judul: "Kenangan #4 💖", pesan: "Kau alasan di balik setiap senyumku. Love you so much, Ayang!"}
    ];

    var no = 0;

    function acak(arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
        }
        return a;
    }

    function tampilFooter() {
        document.getElementById('footer').style.display = 'flex';
        var v = document.getElementById('videoKita');
        v.currentTime = 0;
        v.play().catch(function() {});
    }

    document.getElementById('btnMulai').onclick = function() {
        no = 0;
        tampilSoal();
        document.getElementById('modalQuiz').style.display = 'flex';
    };

    function tampilSoal() {
        var s = soal[no];
        document.getElementById('noSoal').innerText = no + 1;
        document.getElementById('soal').innerText = s.q;
        document.getElementById('progress').innerText = (no + 1) + "/5";

        var ops = acak([s.salah[0], s.salah[1], s.a]);
        var div = document.getElementById('pilihan');
        div.innerHTML = "";

        for (var i = 0; i < ops.length; i++) {
            var btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = ops[i];

            btn.onclick = (function(jwb, benar) {
                return function() {
                    if (jwb === benar) {
                        no++;
                        if (no >= soal.length) {
                            document.getElementById('modalQuiz').style.display = 'none';
                            tampilFooter();
                        } else {
                            tampilSoal();
                        }
                    } else {
                        var rnd = Math.floor(Math.random() * kalimatSalah.length);
                        document.getElementById('txtSalah').innerText = kalimatSalah[rnd].judul;
                        document.getElementById('msgSalah').innerText = kalimatSalah[rnd].pesan;
                        document.getElementById('modalQuiz').style.display = 'none';
                        document.getElementById('modalSalah').style.display = 'flex';
                    }
                };
            })(ops[i], s.a);

            div.appendChild(btn);
        }
    }

    document.getElementById('btnCobaLagi').onclick = function() {
        document.getElementById('modalSalah').style.display = 'none';
        document.getElementById('modalQuiz').style.display = 'flex';
    };

    document.getElementById('btnLihatLain').onclick = function() {
        document.getElementById('modalPesan').style.display = 'none';
        tampilGaleri();
        document.getElementById('modalGaleri').style.display = 'flex';
    };

    document.getElementById('btnSeeFooter').onclick = function() {
        document.getElementById('modalGaleri').style.display = 'none';
        tampilFooter();
    };

    document.getElementById('btnCloseGaleri').onclick = function() {
        document.getElementById('modalGaleri').style.display = 'none';
        tampilFooter();
    };

    document.getElementById('btnCloseFooter').onclick = function() {
        document.getElementById('footer').style.display = 'none';
        var v = document.getElementById('videoKita');
        v.pause(); v.currentTime = 0;
    };

    function tampilGaleri() {
        var g = document.getElementById('gallery');
        g.innerHTML = "";
        for (var i = 0; i < foto.length; i++) {
            var d = document.createElement('div');
            d.className = 'gallery-item';
            d.innerHTML = '<div class="nomor">#' + (i + 1) + '</div><img src="' + foto[i] + '" alt="Kenangan ' + (i + 1) + '" loading="lazy">';

            d.onclick = (function(idx) {
                return function() {
                    document.getElementById('txtPesan').innerText = kataFoto[idx].judul;
                    document.getElementById('msgPesan').innerText = kataFoto[idx].pesan;
                    document.getElementById('modalGaleri').style.display = 'none';
                    document.getElementById('modalPesan').style.display = 'flex';
                };
            })(i);

            g.appendChild(d);
        }
    }

    document.getElementById('btnLihatFoto').onclick = function() {
        var v = document.getElementById('videoKita');
        v.pause();
        document.getElementById('footer').style.display = 'none';
        tampilGaleri();
        document.getElementById('modalGaleri').style.display = 'flex';
    };

    document.getElementById('btnCloseLightbox').onclick = function() {
        document.getElementById('lightbox').style.display = 'none';
        document.getElementById('lightboxImg').src = '';
    };

    document.getElementById('lightbox').onclick = function(e) {
        if (e.target === this) {
            this.style.display = 'none';
            document.getElementById('lightboxImg').src = '';
        }
    };
</script>
</body>
</html>
